name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build client bundle
        run: bun run build

      # Standalone executables (client bundle is embedded via dist/public)
      - name: Build linux x64
        run: bun build --compile --target=bun-linux-x64 --outfile dist/bin/fyrdrop-linux-x64 src/server/index.ts
      - name: Build linux arm64
        run: bun build --compile --target=bun-linux-arm64 --outfile dist/bin/fyrdrop-linux-arm64 src/server/index.ts
      - name: Build windows x64
        run: bun build --compile --target=bun-windows-x64 --outfile dist/bin/fyrdrop-windows-x64.exe src/server/index.ts
      - name: Build macOS arm64
        run: bun build --compile --target=bun-darwin-arm64 --outfile dist/bin/fyrdrop-macos-arm64 src/server/index.ts
      - name: Build macOS x64
        run: bun build --compile --target=bun-darwin-x64 --outfile dist/bin/fyrdrop-macos-x64 src/server/index.ts

      # Bun needs the built client at dist/public next to the binary; pack it separately.
      - name: Package client bundle
        run: |
          cd dist/public
          tar -czf ../../fyrdrop-client-${GITHUB_REF_NAME}.tar.gz .
          cd ../..
          zip -qr fyrdrop-client-${GITHUB_REF_NAME}.zip dist/public

      - name: Package archives
        run: |
          cd dist/bin
          chmod +x fyrdrop-linux-* fyrdrop-macos-*
          tar -czf fyrdrop-${GITHUB_REF_NAME}-linux-x64.tar.gz fyrdrop-linux-x64
          tar -czf fyrdrop-${GITHUB_REF_NAME}-linux-arm64.tar.gz fyrdrop-linux-arm64
          zip -q fyrdrop-${GITHUB_REF_NAME}-windows-x64.zip fyrdrop-windows-x64.exe
          tar -czf fyrdrop-${GITHUB_REF_NAME}-macos-arm64.tar.gz fyrdrop-macos-arm64
          tar -czf fyrdrop-${GITHUB_REF_NAME}-macos-x64.tar.gz fyrdrop-macos-x64
          cd ../..
          cp eggs/pterodactyl/fyrdrop-egg.json fyrdrop-pterodactyl-egg.json
          cp eggs/pelican/fyrdrop-egg.json fyrdrop-pelican-egg.json
          cp eggs/feather/fyrdrop-egg.json fyrdrop-feather-egg.json

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/bin/*.tar.gz
            dist/bin/*.zip
            fyrdrop-client-*.tar.gz
            fyrdrop-client-*.zip
            fyrdrop-pterodactyl-egg.json
            fyrdrop-pelican-egg.json
            fyrdrop-feather-egg.json

  docker-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
