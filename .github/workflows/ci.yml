name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build client
        run: bun run build
      - name: Smoke test server
        run: |
          bun src/server/index.ts &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break || sleep 1
          done
          curl -sf http://localhost:3000/health | grep -q '"ok":true' || (echo "health check failed" && exit 1)
          curl -sf http://localhost:3000/api/auth/status | grep -q 'needsSetup' || (echo "status check failed" && exit 1)
          kill $SERVER_PID

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (validation)
        run: docker build -t fyrdrop:ci .
