name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build client
        run: bun run build
      - name: Smoke test server
        env:
          TLS_ENABLED: "0"
          DATA_DIR: ${{ runner.temp }}/fyrdrop-ci
          PORT: "3000"
        run: |
          bun src/server/index.ts > server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          ready=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then echo "health check failed"; cat server.log; exit 1; fi
          curl -sf http://localhost:3000/health | grep -q '"ok":true' || (echo "health payload wrong" && cat server.log && exit 1)
          curl -sf http://localhost:3000/api/auth/status | grep -q 'needsSetup' || (echo "status check failed" && cat server.log && exit 1)
          curl -sf http://localhost:3000/ > /dev/null || (echo "SPA shell missing" && exit 1)

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (validation)
        run: docker build -t fyrdrop:ci .
