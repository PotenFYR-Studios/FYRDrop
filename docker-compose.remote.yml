# Remote-access sidecars: Tailscale and/or Cloudflare Tunnel.
#
# Usage (from the repo root):
#   Tailscale:   TAILSCALE_AUTHKEY=tskey-auth-xxx TAILSCALE_HOSTNAME=fyrdrop.tailnet.ts.net \
#                  docker compose -f docker-compose.yml -f docker-compose.remote.yml --profile tailscale up -d
#   Cloudflare:  CLOUDFLARE_TUNNEL_TOKEN=eyJ... CLOUDFLARE_HOSTNAME=fyrdrop.example.com \
#                  docker compose -f docker-compose.yml -f docker-compose.remote.yml --profile cloudflare up -d
#
# Notes:
# - The app container should run with TLS_ENABLED=0 when a tunnel terminates TLS.
#   Export it when using either profile (the sidecars set it for themselves via
#   the shared env_file below, or override manually).
services:
  fyrdrop:
    environment:
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME:-}
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      CLOUDFLARE_HOSTNAME: ${CLOUDFLARE_HOSTNAME:-}

  tailscale:
    image: tailscale/tailscale:latest
    container_name: fyrdrop-tailscale
    profiles: ["tailscale"]
    hostname: fyrdrop
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:?set TAILSCALE_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    network_mode: service:fyrdrop # share the app network namespace
    cap_add:
      - net_admin
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fyrdrop-cloudflared
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - fyrdrop
    restart: unless-stopped

volumes:
  tailscale-state:
