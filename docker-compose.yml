services:
  fyrdrop:
    image: ghcr.io/potenfyr-studios/fyrdrop:latest
    container_name: fyrdrop
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Plain HTTP on port 3000 by default. HTTPS is set up in the app under
      # Admin -> Settings -> "HTTP & HTTPS" (self-signed or your certificate),
      # or here: uncomment the next line for a self-signed certificate.
      # A variable set here locks the choice on that page.
      # TLS_ENABLED: "auto"
      SESSION_TTL_DAYS: "30"
      MAX_UPLOAD_MB: "512"
    volumes:
      - fyrdrop-data:/app/data
    healthcheck:
      # -k and the https fallback keep the check truthful when HTTPS is switched on.
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || curl -skf https://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: scale out behind a load balancer (app is stateless; share the volume).
  # fyrdrop-2:
  #   image: ghcr.io/potenfyr-studios/fyrdrop:latest
  #   ports: ["3001:3000"]
  #   volumes: ["fyrdrop-data:/app/data"]

volumes:
  fyrdrop-data:

# Real client addresses and MACs
#
# With the default bridge network Docker rewrites the source address, so the app
# sees the bridge gateway (usually 172.17.0.1) instead of the device's LAN IP.
# On Linux, host networking gives the app the real address and lets it read the
# neighbour table, which is what fills in the MAC column:
#
#   services:
#     fyrdrop:
#       network_mode: host
#       # remove the "ports:" block when using host networking
#       environment:
#         PORT: "3000"
#
# If you terminate TLS at a reverse proxy instead, keep the bridge network and
# set TRUST_PROXY=1 so X-Forwarded-For is honoured (never enable it without a
# proxy you control). The Devices page marks each address with its source.
